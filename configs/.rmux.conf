# ==============================================================================
# .rmux.conf — rmux configuration (Windows)
#
# rmux (github.com/Helvesec/rmux) is a tmux-compatible multiplexer that runs
# natively on Windows, so it covers the one platform install.sh cannot reach
# (lib/platform.sh detect_platform only knows Linux/Darwin).
#
# This is the subset of configs/.tmux.conf that works there. Deliberately
# omitted, because rmux or Windows has no equivalent:
#   - @plugin / run -b tpm / catppuccin  → rmux has no plugin support
#   - if-shell "uname | grep -q ..."     → no uname on Windows
#   - muxa display-popup bindings        → muxa is not installed on Windows
#   - default-shell /bin/zsh             → replaced with pwsh below
#
# Keep the shared bindings below in sync when .tmux.conf changes.
# ==============================================================================

# ==============================================================================
# Core
# ==============================================================================
set-option -g history-limit 10000

# rmux defaults to cmd.exe. This is the standard PowerShell 7 install path;
# adjust if pwsh lives elsewhere on the machine.
set-option -g default-shell "C:\Program Files\PowerShell\7\pwsh.exe"

# ==============================================================================
# Mouse & Input
# ==============================================================================
# rmux ships tmux's full mouse binding table (WheelUpPane, MouseDrag1Pane, and
# a scrollbar) but leaves `mouse` off by default, so without this line the wheel
# does nothing and there is no way to reach the scrollback.
set-option -g mouse on
set-option -g set-clipboard on

# Scroll speed (default 5 lines → 3)
bind-key -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 3 scroll-up
bind-key -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 3 scroll-down

# ==============================================================================
# Visual
# ==============================================================================
set-window-option -g visual-bell on
set-window-option -g bell-action other

set-option -g status on
set-option -g status-position bottom
set-option -g status-justify centre

# ==============================================================================
# Copy Mode
# ==============================================================================
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
# Windows counterpart of .tmux.conf's @copy_cmd (pbcopy / wl-copy / xclip)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip.exe"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# ==============================================================================
# Key Bindings
# ==============================================================================
bind-key C-p previous-window
bind-key C-n next-window
bind-key R source-file ~/.rmux.conf \; display-message "Config reloaded"

# Split panes with | and -
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation (repeatable)
bind-key -r h select-pane -L
bind-key -r j select-pane -D
bind-key -r k select-pane -U
bind-key -r l select-pane -R

# Resize panes with Ctrl + hjkl
bind-key -r C-h resize-pane -L 5
bind-key -r C-j resize-pane -D 5
bind-key -r C-k resize-pane -U 5
bind-key -r C-l resize-pane -R 5

# ==============================================================================
# 한글(두벌식) 입력 모드 prefix 대응 — .tmux.conf 와 동일한 정책.
# C-* 바인딩과 심볼 바인딩은 IME 를 통과하므로 매핑 불필요, "맨키" 영문자
# 바인딩만 대응 자모로 매핑한다. 새 맨키 바인딩을 추가하면 여기도 같이 매핑할 것.
#   q→ㅂ w→ㅈ e→ㄷ r→ㄱ t→ㅅ y→ㅛ u→ㅕ i→ㅑ o→ㅐ p→ㅔ
#   a→ㅁ s→ㄴ d→ㅇ f→ㄹ g→ㅎ h→ㅗ j→ㅓ k→ㅏ l→ㅣ
#   z→ㅋ x→ㅌ c→ㅊ v→ㅍ b→ㅠ n→ㅜ m→ㅡ
#   (Shift) Q→ㅃ W→ㅉ E→ㄸ R→ㄲ T→ㅆ O→ㅒ P→ㅖ
# ==============================================================================
bind-key -r ㅗ select-pane -L      # h
bind-key -r ㅓ select-pane -D      # j
bind-key -r ㅏ select-pane -U      # k
bind-key -r ㅣ select-pane -R      # l
bind-key    ㄲ source-file ~/.rmux.conf \; display-message "Config reloaded"  # R

bind-key ㅇ detach-client          # d
bind-key ㅊ new-window             # c
bind-key ㅜ next-window            # n
bind-key ㅔ previous-window        # p
bind-key ㅈ choose-tree -Zw        # w
bind-key ㅋ resize-pane -Z         # z
bind-key ㅌ confirm-before -p "kill-pane #P? (y/n)" kill-pane   # x
