# TPM Plugin Manager Path
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins'

# Let each zsh instance resolve its version-specific function search path.
# A long-lived tmux server can otherwise retain a stale Homebrew Cellar path.
set-environment -g -u FPATH

# ==============================================================================
# Performance & Core Settings (tmux-sensible handles escape-time, display-time, focus-events)
# ==============================================================================
set-option -g history-limit 10000

# True color support (modern terminals)
set-option -g default-terminal "tmux-256color"
set-option -ga terminal-features ',*256col*:RGB'
set-option -ga terminal-overrides ',*256col*:Tc'

# ==============================================================================
# Plugins (minimal, performance-focused)
# ==============================================================================
set-option -g @plugin 'tmux-plugins/tpm'
set-option -g @plugin 'tmux-plugins/tmux-sensible'
set-option -g @plugin 'tmux-plugins/tmux-resurrect'
set-option -g @plugin 'tmux-plugins/tmux-continuum'
set-option -g @plugin 'catppuccin/tmux#v2.1.3'

# Continuum settings
# NOTE: 2026-05-19 자동복원으로 인한 메모리폭주/크래시루프 때문에 비활성화.
# 안정화 후 다시 'on' 하려면 세션 수를 줄이고 메모리 여유 확인 후 변경할 것.
set-option -g @continuum-restore 'off'

# ==============================================================================
# Catppuccin Theme Configuration (fast, native implementation)
# ==============================================================================
set-option -g @catppuccin_flavor 'mocha'
set-option -g @catppuccin_status_background "none"

# Window styling
set-option -g @catppuccin_window_status_style "rounded"
set-option -g @catppuccin_window_number_position "right"
set-option -g @catppuccin_window_text " #W"
set-option -g @catppuccin_window_current_text " #W"
set-option -g @catppuccin_window_flags "icon"
set-option -g @catppuccin_window_flags_icon_current " 󰖯"
set-option -g @catppuccin_window_flags_icon_last " 󰖰"

# Status bar modules
set-option -g @catppuccin_status_left_separator "█"
set-option -g @catppuccin_status_right_separator "█"
set-option -g @catppuccin_status_connect_separator "no"

# Status bar configuration
set-option -g status-left "#{E:@catppuccin_status_session}"
set-option -g status-right "#{E:@catppuccin_status_directory} #{E:@catppuccin_status_host}"
set-option -g status-left-length 100
set-option -g status-right-length 140

# muxa: per-pane agent glyph refresh (prefix+s binding is set further below)
set-option -g status-interval 2

# ==============================================================================
# Mouse & Input
# ==============================================================================
set-option -g mouse on
set-option -g set-clipboard on

# Scroll speed (native, no plugin needed)
bind-key -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 3 scroll-up
bind-key -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 3 scroll-down

# ==============================================================================
# Shell & Visual
# ==============================================================================
set-option -g default-shell /bin/zsh
set-window-option -g visual-bell on
set-window-option -g bell-action other

# Status bar position (tmux-sensible handles status-interval)
set-option -g status on
set-option -g status-position bottom
set-option -g status-justify centre

# ==============================================================================
# Copy Mode (cross-platform clipboard integration)
# ==============================================================================
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection

# macOS
if-shell "uname | grep -q Darwin" {
  set-option -g @copy_cmd "pbcopy"
}

# Linux (auto-detect Wayland/X11)
if-shell "uname | grep -q Linux" {
  set-option -g @copy_cmd 'if command -v wl-copy >/dev/null; then wl-copy; elif command -v xclip >/dev/null; then xclip -selection clipboard; else tmux display-message \"Clipboard utility not found: install wl-copy or xclip\"; fi'
}

# Bind keys to use the OS-specific copy command
# For SSH sessions, OSC 52 (set-clipboard on) handles clipboard via terminal escape sequences
# For local sessions, also pipe to OS clipboard utility as fallback
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "#{@copy_cmd}"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# Enable mouse drag to start copy mode (allows drag-to-copy in normal mode)
bind-key -T root MouseDrag1Pane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -M }

# ==============================================================================
# Key Bindings
# ==============================================================================
bind-key C-p previous-window
bind-key C-n next-window
bind-key R source-file ~/.tmux.conf \; display-message "Config reloaded"

# Split panes with | and -
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation (repeatable)
bind-key -r h select-pane -L
bind-key -r j select-pane -D
bind-key -r k select-pane -U
bind-key -r l select-pane -R

# Resize panes with Ctrl + hjkl
bind-key -r C-h resize-pane -L 5
bind-key -r C-j resize-pane -D 5
bind-key -r C-k resize-pane -U 5
bind-key -r C-l resize-pane -R 5

# ==============================================================================
# 한글(두벌식) 입력 모드 prefix 대응
# 한글 입력 상태에서도 prefix+키가 동작하도록, 각 영문 바인딩에 대응하는
# 두벌식 자모를 같은 명령에 매핑한다.
#   - C-* 바인딩(C-p/C-n/C-h/j/k/l 등)은 modifier가 IME를 통과하므로 매핑 불필요
#   - 심볼 바인딩(| - [ ] & , 등)도 IME가 건드리지 않으므로 매핑 불필요
# 위 두 케이스를 제외한 "맨키(modifier 없는 영문자)" 바인딩만 여기서 매핑한다.
# 새 영문자 바인딩을 추가하면 아래 대응표를 보고 같이 매핑할 것.
#   q→ㅂ w→ㅈ e→ㄷ r→ㄱ t→ㅅ y→ㅛ u→ㅕ i→ㅑ o→ㅐ p→ㅔ
#   a→ㅁ s→ㄴ d→ㅇ f→ㄹ g→ㅎ h→ㅗ j→ㅓ k→ㅏ l→ㅣ
#   z→ㅋ x→ㅌ c→ㅊ v→ㅍ b→ㅠ n→ㅜ m→ㅡ
#   (Shift) Q→ㅃ W→ㅉ E→ㄸ R→ㄲ T→ㅆ O→ㅒ P→ㅖ
# ==============================================================================

# 내 커스텀 맨키 바인딩 (위 Key Bindings 섹션과 동기화 유지)
bind-key -r ㅗ select-pane -L      # h
bind-key -r ㅓ select-pane -D      # j
bind-key -r ㅏ select-pane -U      # k
bind-key -r ㅣ select-pane -R      # l
bind-key    ㄴ display-popup -E -w 90% -h 85% "muxa watch"                  # s
bind-key    ㄲ source-file ~/.tmux.conf \; display-message "Config reloaded"  # R (Shift+r)

# 자주 쓰는 tmux 기본 맨키 바인딩
bind-key ㅇ detach-client          # d
bind-key ㅊ new-window             # c
bind-key ㅜ next-window            # n
bind-key ㅔ previous-window        # p
bind-key ㅈ choose-tree -Zw        # w
bind-key ㅋ resize-pane -Z         # z
bind-key ㅂ display-popup -B -E -w 100% -h 100% -x 0 -y 0 "muxa peek"   # q (muxa peek)
bind-key ㅌ confirm-before -p "kill-pane #P? (y/n)" kill-pane   # x

# ==============================================================================
# muxa — replace the stock session switcher with the agent-aware TUI
# ==============================================================================
# prefix + s  →  muxa watch in a floating popup. Enter attaches to the
#                selected agent's pane; popup closes on exit.
# (fallback: prefix + w still opens the built-in window/session tree.
#  prefix + C-s is reserved for tmux-resurrect's save.)
bind-key s display-popup -E -w 90% -h 85% "muxa watch"

# ==============================================================================
# Initialize TMUX plugin manager (keep this line at the very bottom)
# ==============================================================================
run -b '~/.tmux/plugins/tpm/tpm'

# muxa socket: intentionally NOT pinned here.
# `muxa init` wants to write a `set-environment -g MUXA_SOCKET "/tmp/muxa-<uid>.sock"`
# block, but that path is host-specific and this file is shared across machines.
# Every muxa binary already derives the same path itself
# (crates/muxa/src/paths.rs `default_socket()`: $XDG_RUNTIME_DIR/muxa.sock, else
# /tmp/muxa-<uid>.sock), so the pin is redundant unless muxad's config.toml
# overrides `socket` to a custom path. If it ever does, set MUXA_SOCKET from your
# shellrc rather than hardcoding a uid in here.
# If `muxa init` re-adds a `muxa managed (tmux-env)` block below, delete it again.

# >>> muxa managed (tmux-popup) >>>
# Muxa popups: watch all agents, or collaborate as the focused agent.
bind-key s display-popup -E -w 90% -h 85% "muxa watch"
bind-key D display-popup -E -w 95% -h 90% "muxa dashboard"
# <<< muxa managed (tmux-popup) <<<

# >>> muxa managed (tmux-peek) >>>
# prefix + q: display-panes, plus each pane's agent state, summary, and
# latest prompt/response over its live content. A pane's digit jumps to it.
# Replaces tmux's stock display-panes; `muxa init --uninstall` puts it back.
bind-key q display-popup -B -E -w 100% -h 100% -x 0 -y 0 "muxa peek"
# <<< muxa managed (tmux-peek) <<<
