# Managed Codex configuration — generated by scripts/codex/capture-config.sh.
#
# Do not hand-edit: change ~/.codex/config.toml, then re-run the capture script.
# Applied by scripts/codex/apply-config.sh, which layers this over the target
# machine's own project trust, hook trust hashes, plugins and MCP servers.
model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"
approval_policy = "never"
sandbox_mode = "danger-full-access"

auto_checkpoint = true
personality = "pragmatic"
service_tier = "default"

# Added by Oh My Prompt

[tui]
notifications = true

[agents]
max_threads = 18

[apps._default]
enabled = false

[features]
fast_mode = true
streamable_shell = true
apps = false

[sandbox_workspace_write]
network_access = true

[plugins."github@openai-curated"]
enabled = false

[plugins."notion@openai-curated"]
enabled = false

[plugins."linear@openai-curated"]
enabled = false

# Disable only the bundled GitHub publish workflow.
[[skills.config]]
path = "/home/june/.codex/plugins/cache/openai-curated-remote/github/0.1.8-2841cf9749ae/skills/yeet/SKILL.md"
enabled = false

# Disabled 2026-06-22: local CLI-based `integration-notion` uses `notion-tool`
# and `~/.agents/NOTION.yaml`; keeping Notion MCP enabled adds tool/context
# overhead and can steer agents away from the local entrypoint.
# [mcp_servers.notion]
# url = "https://mcp.notion.com/mcp"

[notice]
hide_rate_limit_model_nudge = true
hide_full_access_warning = true
fast_default_opt_out = true

[[hooks.SessionStart]]
hooks = [{ type = "command", command = "muxa hook codex --event session_start" }]

[[hooks.UserPromptSubmit]]
hooks = [{ type = "command", command = "muxa hook codex --event user_prompt_submit" }]

[[hooks.PreToolUse]]
hooks = [{ type = "command", command = "muxa hook codex --event pre_tool_use" }]

[[hooks.PostToolUse]]
hooks = [{ type = "command", command = "muxa hook codex --event post_tool_use" }]

[[hooks.PermissionRequest]]
hooks = [{ type = "command", command = "muxa hook codex --event permission_request" }]

[[hooks.Stop]]
hooks = [{ type = "command", command = "muxa hook codex --event stop" }]

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[mcp_servers.muxa]
command = "muxa"
args = ["mcp"]
env_vars = ["TMUX", "TMUX_PANE", "MUXA_SOCKET"]
