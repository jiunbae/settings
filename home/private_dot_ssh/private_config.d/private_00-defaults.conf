# Global SSH defaults
# Applied to all hosts. ssh takes the first value it sees for each option, so
# this file is included last and a host block above overrides any line here.

Host *
  IgnoreUnknown UseKeychain
  AddKeysToAgent yes
  UseKeychain yes
  IdentitiesOnly yes
  # A multiplexed master that lost its network (sleep, Wi-Fi/Tailscale switch)
  # hangs every session riding on it. Probe it and give up after ~90s.
  ServerAliveInterval 30
  ServerAliveCountMax 3
  ControlMaster auto
  # %C is a hash of the connection, so long tailnet hostnames cannot push the
  # socket path past macOS's 104-byte limit.
  ControlPath ~/.ssh/mux/%C
  ControlPersist 30m
  # No Compression here: most hosts are LAN/tailnet, where it only costs CPU.
  # Turn it on per host for a slow link.
