<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Docs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --docsify-example-panel-left-width: 60%;
    }
    .markdown-section {
      max-width: 900px;
    }
    .app-nav {
      position: fixed;
      right: 20px;
      top: 10px;
      z-index: 10;
    }
  </style>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-8JQSR962RQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-8JQSR962RQ");
  </script>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: "Docs",
      loadSidebar: true,
      subMaxLevel: 3,
      search: {
        placeholder: "Search...",
        noData: "No results",
        depth: 3
      },
      auto2top: true,
      copyCode: {
        buttonText: "Copy",
        successText: "Copied"
      },
      pagination: {
        previousText: "Prev",
        nextText: "Next",
        crossChapter: true
      },
      requestHeaders: {
        "Cache-Control": "no-cache"
      },
      alias: {
        "/_sidebar.md": "/_sidebar.md?v=" + Date.now()
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-go.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
</body>
</html>
